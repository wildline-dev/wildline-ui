[project]
name = "wildline-ui"
version = "0.2.0"
description = "Shared low-bandwidth styling for Wildline Django apps: a slim Bootstrap 5 build and a tag that inlines it"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1,<6.2",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
